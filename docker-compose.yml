services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3225/api}
    container_name: aiignite-cad-frontend
    ports:
      - "3220:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3225
    networks:
      - aiignite-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiignite-cad-backend
    ports:
      - "3225:3225"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://aiignite:aiignite123@db:5432/ai_ignite_cad
      - PORT=3225
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-20}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      - AI_RATE_LIMIT_MAX=${AI_RATE_LIMIT_MAX:-30}
      - AI_RATE_LIMIT_WINDOW_MS=${AI_RATE_LIMIT_WINDOW_MS:-60000}
      - DWG_CONVERTER_URL=http://dwg-converter:3310
      - DWG_MAX_FILE_MB=${DWG_MAX_FILE_MB:-50}
      - DWG_MAX_DXF_MB=${DWG_MAX_DXF_MB:-100}
      - DWG_CONVERT_TIMEOUT_MS=${DWG_CONVERT_TIMEOUT_MS:-60000}
      - IMPORT_RATE_LIMIT_MAX=${IMPORT_RATE_LIMIT_MAX:-20}
      - IMPORT_RATE_LIMIT_WINDOW_MS=${IMPORT_RATE_LIMIT_WINDOW_MS:-600000}
    networks:
      - aiignite-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3225/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DWG → DXF 转换器（LibreDWG sidecar，仅内网访问）
  dwg-converter:
    build:
      context: ./dwg-converter
      dockerfile: Dockerfile
    container_name: aiignite-cad-dwg-converter
    restart: unless-stopped
    environment:
      - PORT=3310
      - MAX_FILE_MB=${DWG_MAX_FILE_MB:-50}
      - CONVERT_TIMEOUT_MS=${DWG_CONVERT_TIMEOUT_MS:-60000}
      - CONVERT_CONCURRENCY=${DWG_CONVERT_CONCURRENCY:-2}
    networks:
      - aiignite-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PostgreSQL数据库
  db:
    image: postgres:15-alpine
    container_name: aiignite-cad-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aiignite}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiignite123}
      - POSTGRES_DB=${POSTGRES_DB:-ai_ignite_cad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiignite-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aiignite-network:
    driver: bridge

volumes:
  postgres_data: