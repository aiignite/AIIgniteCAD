server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 express.json({ limit: "50mb" }) 对齐，留出 multipart 余量
    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = / {
        return 301 /cad/;
    }

    location = /cad {
        return 301 /cad/;
    }

    # 带内容哈希的构建产物与本地图标字体：可长期缓存
    location /cad/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /cad/fonts/ {
        alias /usr/share/nginx/html/fonts/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # public/ 下的文件没有内容哈希，URL 恒定：只有字体二进制能长期缓存。
    # 同目录的 @font-face 样式必须每次回源校验，否则改了字体路径后，
    # 老访客还会用 30 天缓存里的旧 CSS，图标继续退化成连字文本。
    location = /cad/fonts/material-symbols/material-symbols-local.css {
        alias /usr/share/nginx/html/fonts/material-symbols/material-symbols-local.css;
        expires -1;
    }

    # SSE 唯一端点。精确匹配，避免 proxy_buffering off 波及整个 /cad/api/ 前缀
    location = /cad/api/llm/chat {
        proxy_pass http://backend:3225/api/llm/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 实时协作（实验性）走 WebSocket upgrade；其余接口不受此块影响
    location /cad/socket.io/ {
        proxy_pass http://backend:3225/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /cad/api/ {
        proxy_pass http://backend:3225/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /cad/health {
        proxy_pass http://backend:3225/health;
    }

    location = /cad/ready {
        proxy_pass http://backend:3225/ready;
    }

    # 入口 HTML 每次回源校验，否则它会把已下线的哈希 JS 钉在浏览器里；
    # try_files 的内部跳转也会重新匹配到这里。
    location = /cad/index.html {
        alias /usr/share/nginx/html/index.html;
        expires -1;
    }

    # SPA 回退：dist 直接挂在子路径下，资源前缀由 vite base 决定
    location /cad/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /cad/index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
